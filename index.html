      if (name === 'Сергей') return 'emp-serg';
      if (name === 'Филипп') return 'emp-phil';

    function calculateHours() {
      if (!startTimeInput.value || !endTimeInput.value) return;
      const [sh, sm] = startTimeInput.value.split(':').map(Number);
      const [eh, em] = endTimeInput.value.split(':').map(Number);
      let diff = (eh + em / 60) - (sh + sm / 60);
      if (diff <= 0) diff += 24;
